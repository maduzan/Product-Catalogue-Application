name: Product Catalogue Application
description: "Assesment"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  awesome_dio_interceptor: ^1.3.0
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.1.0
  font_awesome_flutter: ^11.0.0
  gap: ^3.0.1
  get_it: ^9.2.1
  go_router: ^17.1.0
  google_fonts: ^8.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  infinite_scroll_pagination: ^5.1.1
  provider: ^6.1.5

  shimmer: ^3.0.0

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - env/.env.development
    - env/.env.production
    - env/.env.staging

